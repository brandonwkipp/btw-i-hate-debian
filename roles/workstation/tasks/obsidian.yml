---
- name: Symlink libz.so for AppImage runtime compatibility
  file:
    src: /usr/lib/aarch64-linux-gnu/libz.so.1
    dest: /usr/lib/aarch64-linux-gnu/libz.so
    state: link

- name: Download Obsidian AppImage
  get_url:
    url: "{{ obsidian_download_url }}"
    dest: "/home/{{ local_user }}/.local/bin/Obsidian.AppImage"
    mode: '0755'
  when: obsidian_download_url is defined

- name: Create Obsidian desktop entry
  copy:
    dest: "/home/{{ local_user }}/.local/share/applications/obsidian.desktop"
    content: |
      [Desktop Entry]
      Name=Obsidian
      Exec=/home/{{ local_user }}/.local/bin/Obsidian.AppImage --appimage-extract-and-run
      Icon=obsidian
      Type=Application
      Categories=Office;
  when: obsidian_download_url is defined
